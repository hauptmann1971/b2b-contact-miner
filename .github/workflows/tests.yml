name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: contact_miner
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/contact_miner?charset=utf8mb4
      ADMIN_USERNAME: testadmin
      ADMIN_PASSWORD: testpass
      TELEGRAM_BOT_TOKEN: "123456:ABC-DEF"
      TELEGRAM_BOT_USERNAME: test_bot
      ADMIN_TELEGRAM_IDS: "42"
      DEFAULT_TENANT_SLUG: company
      DEFAULT_TENANT_NAME: Company

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-mysql-client

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysql -h 127.0.0.1 -uroot -proot -e "SELECT 1" contact_miner && exit 0
            sleep 2
          done
          echo "MySQL did not become ready in time"
          exit 1

      - name: Verify database connection
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from services.tenant_bootstrap import bootstrap_default_tenant, ensure_multitenant_schema

          url = os.environ["DATABASE_URL"]
          print("DATABASE_URL:", url)
          engine = create_engine(url)
          with engine.connect() as conn:
              print("SELECT 1 =>", conn.execute(text("SELECT 1")).scalar())
          ensure_multitenant_schema()
          bootstrap_default_tenant()
          print("bootstrap ok")
          PY

      - name: Run tests
        run: |
          python - <<'PY'
          import os
          from models.database import engine
          print("pytest DATABASE_URL:", os.environ.get("DATABASE_URL"))
          print("engine url:", engine.url)
          with engine.connect() as conn:
              print("engine connect ok")
          PY
          python -m pytest tests/ -q --tb=short -rA
